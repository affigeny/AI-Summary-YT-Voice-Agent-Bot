# Render deploy config (Blueprint)
# Обход ограничения Free-тарифа: Web Service + фиктивный HTTP-сервер.
# Free-тариф доступен только для Web Service / Static Site (у Background Worker его нет).
# Бот использует run_polling() + встроенный фиктивный HTTP-сервер (порт $PORT).
# ВАЖНО: секреты (token/key) задаются в панели Render, НЕ в этом файле.
services:
  - type: web
    name: yt-bot-sum
    runtime: docker
    repo: https://github.com/affigeny/YT_Bot_Sum
    region: frankfurt
    branch: main
    plan: free
    healthCheckPath: /health
    envVars:
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: AI_PROVIDER
        value: openai
      - key: AI_API_URL
        value: https://openrouter.ai/api/v1
      - key: AI_MODEL
        value: openai/gpt-4o-mini
      - key: DB_PATH
        value: /var/data/bot_database.db
      # AI_API_KEY задаётся вручную (секрет, не хранить в репозитории)
      - key: AI_API_KEY
        sync: false
      # Куки YouTube для обхода bot-check (YouTube часто требует авторизацию).
      # Вариант A: путь к файлу cookies.txt (загрузить в Render через Secret Files или
      #   экспортировать: yt-dlp --cookies-from-browser chrome -o cookies.txt "URL").
      #   Тогда задать YT_COOKIES_FILE=/var/data/cookies.txt
      # Вариант B (только для локального запуска): YT_COOKIES_FROM_BROWSER=chrome
      - key: YT_COOKIES_FILE
        sync: false
      - key: YT_COOKIES_FROM_BROWSER
        value: ""
